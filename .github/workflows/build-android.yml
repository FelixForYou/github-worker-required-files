name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      jobId:
        description: Build job ID
        required: true
        type: string
      userId:
        description: Telegram user ID
        required: true
        type: string
      payload:
        description: JSON build payload
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: web2apk-android-${{ inputs.jobId }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BUILD_PAYLOAD: ${{ inputs.payload }}

    steps:
      - name: Checkout worker repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Generate Android project
        shell: bash
        run: node worker/actions/prepare-android.js

      - name: Build release APK
        shell: bash
        working-directory: .github-build/android-project
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon clean assembleRelease

      - name: Collect APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .github-build/output
          APK_PATH="$(find .github-build/android-project/app/build/outputs/apk -type f -name '*.apk' | head -n 1)"
          test -n "$APK_PATH"
          cp "$APK_PATH" ".github-build/output/${{ inputs.jobId }}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: apk-${{ inputs.jobId }}
          path: .github-build/output/${{ inputs.jobId }}.apk
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
